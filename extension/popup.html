<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>마음데이터 기업조회 비서</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <span class="logo-emoji">🏢</span>
        <span class="logo-text">마음데이터 비서</span>
      </div>
    </header>
    
    <main class="main">
      <p class="desc">사업자등록번호 또는 기업명을 입력해 보세요.</p>
      
      <form id="search-form" class="search-form">
        <input type="text" id="search-input" placeholder="예: 120-88-01280 또는 토스" required autofocus>
        <button type="submit" class="btn-search">조회</button>
      </form>
      
      <div id="error-msg" class="error-msg hidden"></div>
    </main>
    
    <footer class="footer">
      <a href="https://www.maumdata.com" target="_blank" class="footer-link">마음데이터 홈 바로가기 ↗</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
